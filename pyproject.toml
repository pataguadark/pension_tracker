[project]
name = "pensiontracker"
version = "1.0.0"
description = "Pensión Tracker — registro y seguimiento de pagos de pensión alimenticia (Chile, UTM)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=2.3.0",
    "Flask-WTF>=1.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "platformdirs>=4.0.0",
    "pywebview>=5.0",
]

[project.scripts]
pensiontracker = "pensiontracker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pensiontracker"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]
