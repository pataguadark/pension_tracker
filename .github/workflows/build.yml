name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PensionTracker-windows
          - os: macos-latest
            artifact: PensionTracker-macos
          - os: ubuntu-latest
            artifact: PensionTracker-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar Python
        run: uv python install 3.12

      - name: Dependencias del sistema para el build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1 python3-gi

      - name: Instalar dependencias del proyecto
        run: uv sync

      # tests/test_interoperabilidad_db.py levanta el lado TypeScript con
      # `npx vite-node` para comprobar que las dos plataformas leen el mismo
      # .db. Sin Node ni node_modules, esas pruebas mueren con
      # FileNotFoundError y el job queda rojo aunque el código esté bien: en
      # el momento del tag (push de rama no dispara, a diferencia de
      # tests.yml) este job es la única red antes de publicar el release.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias del móvil (para las pruebas de interoperabilidad)
        run: npm ci --prefix mobile

      - name: Tests
        run: uv run pytest

      - name: Build con PyInstaller
        run: uv run pyinstaller packaging/pensiontracker.spec

      - name: Descargar appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool

      - name: Empaquetar AppImage (Linux)
        if: runner.os == 'Linux'
        run: packaging/appimage/build-appimage.sh

      - name: Comprimir build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist
          7z a "../${{ matrix.artifact }}.zip" PensionTracker

      - name: Comprimir build (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "PensionTracker.app" "../${{ matrix.artifact }}.zip"

      - name: Subir artefacto (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/PensionTracker-x86_64.AppImage

      - name: Subir artefacto (Windows/macOS)
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  # En pausa deliberada: el móvil todavía no tiene forma de sacar los datos
  # del teléfono (no existen mobile/src/data/respaldo.ts ni importador.ts,
  # ver Historial.svelte). Publicar el APK ahora dejaría a quien lo instale
  # sin vía de escape para su registro de pagos, y con allowBackup=false
  # (ver AndroidManifest.xml) tampoco quedaría una copia en la nube de
  # Google que lo salve. El job sigue compilando y firmando -eso ya está
  # hecho y probado- pero solo a mano, vía workflow_dispatch, para poder
  # seguir ejercitando el pipeline sin publicar. Para reactivarlo: escribir
  # respaldo.ts (y su importador) y volver a agregar "android" al `needs`
  # del job release.
  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Calcular la versión desde el tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            nombre="${GITHUB_REF_NAME#v}"
            if [[ ! "${nombre}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::El tag '${GITHUB_REF_NAME}' no tiene la forma vMAYOR.MENOR.PARCHE."
              exit 1
            fi
            IFS='.' read -r mayor menor parche <<< "${nombre}"
            # Android solo sabe comparar enteros, así que la versión se aplana
            # a uno solo. Con este esquema el menor y el parche no pueden pasar
            # de 99; de lo contrario dos versiones distintas colisionarían.
            if (( menor > 99 || parche > 99 )); then
              echo "::error::menor y parche no pueden pasar de 99 con este esquema de versionCode."
              exit 1
            fi
            codigo=$(( 10#${mayor} * 10000 + 10#${menor} * 100 + 10#${parche} ))
          else
            # Ejecución manual sin tag: sirve para ver si compila, no se publica.
            nombre="0.0.0-dev"
            codigo=1
          fi
          echo "nombre=${nombre}" >> "$GITHUB_OUTPUT"
          echo "codigo=${codigo}" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        run: npm ci
        working-directory: mobile

      - name: Construir el bundle
        run: npm run build
        working-directory: mobile

      - name: Copiar el bundle al proyecto nativo
        run: npx cap sync android
        working-directory: mobile

      - name: Verificar que el keystore esté configurado
        # Sin keystore, `assembleRelease` no falla: deja un APK sin firmar que
        # Android se niega a instalar. Sin este corte, el release publicaría un
        # archivo que nadie puede usar y el fallo se descubriría en el teléfono
        # de quien lo descargue.
        env:
          PT_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${PT_KEYSTORE_BASE64}" ]]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64. Cómo generarlo y cargarlo: docs/construir-android.md, sección 'Firmar el APK de release'."
            exit 1
          fi

      - name: Compilar el APK firmado
        run: ./gradlew assembleRelease
        working-directory: mobile/android
        env:
          PT_VERSION_NAME: ${{ steps.version.outputs.nombre }}
          PT_VERSION_CODE: ${{ steps.version.outputs.codigo }}
          PT_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Renombrar el APK con su versión
        run: |
          mv mobile/android/app/build/outputs/apk/release/app-release.apk \
             "PensionTracker-${{ steps.version.outputs.nombre }}.apk"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PensionTracker-android
          path: PensionTracker-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Crear release con los 3 binarios
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
